# ============================================================
# .github/workflows/release-pypi.yml
# (Release PyPI + docs via Zensical)
# ============================================================
# Updated: 2026-09-29
#
# WHY: Publish a tagged release to PyPI and deploy docs to GitHub Pages.
# REQ: Trigger ONLY on version tags like v1.2.3.
# REQ: PyPI project must be configured for Trusted Publishing (OIDC).
# REQ: uv build must run before anything that modifies the working tree (including uv sync).
# REQ: Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions

name: Release (PyPI + Zensical docs)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"       # WHY: Real-time logging.
  PYTHONIOENCODING: "utf-8"   # WHY: Ensure UTF-8 encoding for international characters.
  UV_FROZEN: "1" # WHY: CI MUST use the committed lockfile without updating it.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # WHY: Never cancel a release in progress.

jobs:

  pre-release:
    uses: $/.github/workflows/pre-release.yml
    permissions:
      contents: read

  build-and-release:
    needs: pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:

      # === ASSEMBLE ===

      - name: A1) Checkout repository with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # WHY: hatch-vcs needs full history to derive version from tags.
          fetch-tags: true
          ref: ${{ github.ref }}
          persist-credentials: false
          # WHY: Required so all subsequent steps can access repo files.

      - name: A2) Install uv (with caching)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          cache-dependency-glob: "uv.lock"
          # WHY: Invalidate dependency cache when the committed lockfile changes.

      - name: A3) Install project Python
        run: uv python install
        # WHY: Ensures the Python version declared in .python-version is available.
        # OBS: uv manages the interpreter locally in the CI environment.

      - name: A4) Install dependencies from committed lockfile
        run: uv sync --frozen
        # WHY: Install all configured dependency groups exactly from uv.lock.
        # REQ: CI MUST fail rather than update a stale or incompatible lockfile.

      - name: A5) Show tool versions
        run: |
          uv --version
          uv run python --version
          uv run python -m ruff --version
          uv run ty --version
          if [ -f "zensical.toml" ]; then
            uv run python -m zensical --version
          fi
          uv run --no-sync prek --version 2>/dev/null \
            || uv run --no-sync pre-commit --version 2>/dev/null \
            || echo "No hook runner installed"
        # WHY: Version output makes CI logs easier to debug when tools change.

      - name: A6) Configure GitHub Pages
        # WHY: Sets Pages metadata for deployments.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # ============================================================
      # B) BUILD
      # ============================================================

      - name: B1) Identify release tag, if present
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Expected a release tag such as v0.1.0."
              exit 1
            fi

            echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Manual branch run: development build."
            echo "release=" >> "$GITHUB_OUTPUT"
          fi

      - name: B2) Verify git is clean before build
        run: |
          echo "Git status:"
          git status --short
          echo "Git describe:"
          git describe --tags --always --dirty
          if [[ $(git status --porcelain) ]]; then
            echo "ERROR: Git tree is dirty before build!"
            exit 1
          fi

      - name: B3) Build sdist + wheel
        # WHY: hatch-vcs derives version from git tag; build before uv sync
        # to avoid working tree changes invalidating the clean check.
        run: uv build

      # ============================================================
      # C) CHECKS
      # ============================================================

      - name: C1) Ensure built artifact version matches tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.release }}
        run: |
          set -e
          echo "Tag version: $TAG"
          ls dist
          if ! ls dist/*"$TAG"*.whl dist/*"$TAG"*.tar.gz >/dev/null 2>&1; then
            echo "ERROR: Built artifact version does not match tag $TAG"
            exit 1
          fi
          echo "Artifact version matches tag."

      - name: C2) Sync dependencies
        run: uv sync --frozen

      - name: C3) Ruff format (check only)
        run: uv run ruff format --check .

      - name: C4) Ruff lint (no fixes)
        run: uv run ruff check .

      - name: C5) Validate pyproject.toml
        run: uvx validate-pyproject

      - name: C6) ty (type check)
        run: uv run ty check

      - name: C7) Validate built artifacts
        run: uv run twine check dist/*

      # ============================================================
      # D) DEPLOY RELEASE AND DOCS
      # ============================================================

      - name: D1) Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
          make_latest: true

      - name: D2) Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: D3) Build docs with Zensical
        run: |
          if [ ! -f "zensical.toml" ]; then
            echo "zensical.toml not found; skipping docs deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run zensical build

      - name: D4) Verify site output exists
        run: |
          if [ ! -d "site" ]; then
            echo "## Documentation build output missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Expected directory 'site/' was not created." >> "$GITHUB_STEP_SUMMARY"
            echo "Check the Zensical build step and zensical.toml configuration." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: D5) Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: D6) Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
